name: Redeploy no Portainer

on:
  push:
    branches: [main]

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar webhook do Portainer
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Defina o secret PORTAINER_WEBHOOK_URL com a URL do webhook da stack do front."
            exit 1
          fi
          curl --fail --silent --show-error --request POST --max-time 60 "$WEBHOOK_URL"
